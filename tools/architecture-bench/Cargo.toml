[package]
name = "architecture-bench"
version = "0.1.0"
edition = "2024"
default-run = "architecture-bench"

[[bin]]
name = "tcp-lifecycle-bench"
path = "src/tcp_lifecycle.rs"

[[bin]]
name = "futex-transactions-bench"
path = "src/futex_transactions.rs"

[[bin]]
name = "unix-packet-bench"
path = "src/unix_packet.rs"

[[bin]]
name = "unix-rights-bench"
path = "src/unix_rights.rs"

[[bin]]
name = "inotify-bench"
path = "src/inotify.rs"

[[bin]]
name = "realtime-signals-bench"
path = "src/realtime_signals.rs"

[[bin]]
name = "audio-mixer-bench"
path = "src/audio_mixer.rs"

[[bin]]
name = "span-heap-bench"
path = "src/span_heap.rs"

[[bin]]
name = "blocked-load-bench"
path = "src/blocked_load.rs"

[dependencies]
mmio = { path = "../../libraries/mmio" }
netstack-unit = { path = "../netstack-unit" }
fallible-tree = { path = "../../libraries/fallible-tree" }
span-heap = { path = "../../libraries/span-heap", features = ["host"] }
native-runtime = { path = "../../system/native-runtime" }
device-model = { path = "../../system/device-model" }
network-protocol = { path = "../../system/network-protocol" }
bitflags = "2.4"
spin = { version = "0.10.0", default-features = false, features = ["mutex", "spin_mutex", "once"] }
linux-abi = { path = "../../abi/linux-abi" }

[lints]
workspace = true
