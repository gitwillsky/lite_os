[package]
name = "terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autolib = false

# The terminal app. It supplies no HostExtension: the PTY/VT client is
# runtime-integrated I/O infrastructure (it participates in the runtime's event
# loop — poll fd, screen dispatch, viewport resize, EOF-driven exit), not
# application business logic, so it stays in the library, gated to the terminal
# app. This binary is the generic runtime with the terminal bundle.
[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
lite-runtime = { path = "../../lite-runtime" }
