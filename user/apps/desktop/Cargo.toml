[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autolib = false

# The desktop shell: the generic runtime library plus a `DesktopExt` that owns
# desktop *policy* — the application launcher registry (scanning app.json),
# launching apps as their own `/bin/<id>` binaries, and shutdown. The surface
# *mechanism* (configure/move/focus/close, accelerators) and system-volume
# control stay in the runtime library as Role::Desktop compositor-client
# infrastructure.
[[bin]]
name = "desktop"
path = "src/main.rs"

[dependencies]
lite-runtime = { path = "../../lite-runtime" }
serde.workspace = true
serde_json.workspace = true
