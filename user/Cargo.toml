[workspace]
members = [
    "calendar",
    "canvas",
    "classic-theme",
    "compositor",
    "logon",
    "control-panel",
    "desktop",
    "desktop-entry",
    "file-explorer",
    "classic-ui",
    "keyboard",
    "linux-uapi",
    "terminal-font",
    "terminal-model",
    "typeface",
    "wayland-scanner",
    "wayland-wire",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
linux-uapi = { path = "linux-uapi" }
keyboard = { path = "keyboard" }
terminal-font = { path = "terminal-font" }
terminal-model = { path = "terminal-model" }
unicode-width = "=0.2.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
