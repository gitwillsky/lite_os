[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
spin = { version = "0.10.0", default-features = false, features = ["mutex", "once", "spin_mutex"] }
dtb-walker = { path = "../vendor/dtb-walker", version = "=0.2.0-alpha.3" }
bitflags = "2.9.1"
native-abi = { path = "../abi/native-abi" }
fallible-tree = { path = "../libraries/fallible-tree" }
mmio = { path = "../libraries/mmio" }
pci-config = { path = "../libraries/pci-config" }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.14.0"

[lints]
workspace = true
