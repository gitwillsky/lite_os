[workspace]
members = [
    "kernel",
    "boot-scene",
    "syscall-abi",
    "tools/architecture-check",
    "tools/architecture-bench",
    "tools/kernel-unit",
    "tools/scheduler-unit",
]
exclude = [
    "vendor/smoltcp",
    "bootloader",
    "user/libraries/canvas",
    "user/libraries/classic-theme",
    "user/libraries/classic-ui",
    "user/programs/compositor",
    "user/programs/logon",
    "user/programs/desktop",
    "user/libraries/desktop-entry",
    "user/libraries/desktop-settings",
    "user/programs/control-panel",
    "user/libraries/calendar",
    "user/libraries/sound",
    "user/programs/task-manager",
    "user/libraries/sndvol",
    "user/programs/volume-control",
    "user/programs/sound-player",
    "user/programs/media-player",
    "user/programs/notepad",
    "user/programs/device-manager",
    "user/programs/file-explorer",
    "user/libraries/keyboard",
    "user/libraries/liteos-runtime",
    "user/libraries/linux-uapi",
    "user/libraries/terminal-font",
    "user/libraries/terminal-model",
    "user/libraries/typeface",
    "user/libraries/wayland-scanner",
    "user/libraries/wayland-wire",
]
default-members = ["kernel"]
resolver = "3"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = "s"
debug-assertions = true

# 宿主测试保留回溯行号，避免每个 fixture 携带完整类型/变量调试信息。
# 不覆盖 dev：PROFILE=debug 的内核仍可用 GDB 检查变量。
[profile.test]
debug = "line-tables-only"
