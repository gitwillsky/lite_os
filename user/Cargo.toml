[workspace]
members = [
    "console",
    "keyboard",
    "linux-uapi",
    "seat-proto",
    "seatd",
    "terminal-font",
    "terminal-model",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
linux-uapi = { path = "linux-uapi" }
keyboard = { path = "keyboard" }
seat-proto = { path = "seat-proto" }
terminal-font = { path = "terminal-font" }
terminal-model = { path = "terminal-model" }
unicode-width = "=0.2.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
