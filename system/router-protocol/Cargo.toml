[package]
name = "router-protocol"
version = "0.1.0"
edition = "2024"
description = "原生路由配置模型与元数据、网络设置投影、DHCP 租约与路由来源编码"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
schemars = { version = "=1.2.3", default-features = false, features = ["derive"] }
ulid = { version = "=3.0.0", default-features = false }

[lints]
workspace = true
