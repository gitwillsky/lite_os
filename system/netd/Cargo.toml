[package]
name = "netd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "netd"
test = false
bench = false

[dependencies]
native-runtime = { path = "../native-runtime" }
service-sync = { path = "../service-sync" }
service-rpc = { path = "../service-rpc" }
device-model = { path = "../device-model" }
device-protocol = { path = "../device-protocol" }
network-protocol = { path = "../network-protocol" }
launch-protocol = { path = "../launch-protocol" }
fallible-tree = { path = "../../fallible-tree" }
smoltcp = { version = "=0.13.1", path = "../../vendor/smoltcp", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "socket-raw", "socket-tcp", "socket-tcp-reno", "socket-udp"] }

[build-dependencies]
launch-protocol = { path = "../launch-protocol" }

[lints]
workspace = true
