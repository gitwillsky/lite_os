[package]
name = "netstack"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "netstack"
test = false
bench = false

[dependencies]
tcp = { path = "../../libraries/tcp" }
hashbrown = { version = "=0.16.1", default-features = false }
siphasher = { version = "=1.0.1", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
prefix-index = { path = "../../libraries/prefix-index" }
router-protocol = { path = "../router-protocol" }
packet-wire = { path = "../../libraries/packet-wire" }
native-runtime = { path = "../native-runtime" }
service-sync = { path = "../service-sync" }
service-rpc = { path = "../service-rpc" }
service-directory = { path = "../service-directory" }
device-model = { path = "../device-model" }
device-protocol = { path = "../device-protocol" }
network-protocol = { path = "../network-protocol" }
launch-protocol = { path = "../launch-protocol" }
fallible-tree = { path = "../../libraries/fallible-tree" }

[build-dependencies]
launch-protocol = { path = "../launch-protocol" }

[lints]
workspace = true
