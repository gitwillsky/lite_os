<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- libass（libmpv 字幕）经 fontconfig 选字体；只暴露系统字体目录，缺失时中文字幕无法渲染。 -->
<fontconfig>
  <dir>/usr/share/liteos/fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <alias><family>sans-serif</family><prefer><family>Tahoma</family><family>SimSun</family></prefer></alias>
  <alias><family>serif</family><prefer><family>SimSun</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>SimSun</family></prefer></alias>
</fontconfig>
