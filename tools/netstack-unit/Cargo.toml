[package]
name = "netstack-unit"
version = "0.1.0"
edition = "2024"

[dependencies]
tcp = { path = "../../libraries/tcp" }
hashbrown = { version = "=0.16.1", default-features = false }
siphasher = { version = "=1.0.1", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
bgp = { path = "../../system/bgp" }
routing-rib = { path = "../../system/routing-rib" }
prefix-index = { path = "../../libraries/prefix-index" }
router-protocol = { path = "../../system/router-protocol" }
packet-wire = { path = "../../libraries/packet-wire" }
fallible-tree = { path = "../../libraries/fallible-tree" }
device-model = { path = "../../system/device-model" }
network-protocol = { path = "../../system/network-protocol" }
native-abi = { path = "../../abi/native-abi" }
spin = { version = "0.10.0", default-features = false, features = ["mutex", "spin_mutex", "once"] }
smoltcp = { version = "=0.13.1", path = "../../vendor/smoltcp", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "socket-raw"] }

[dev-dependencies]
dhcp-server = { path = "../../system/dhcp-server" }
md-5 = { version = "=0.10.6", default-features = false, features = ["force-soft"] }
zeroize = { version = "=1.9.1", default-features = false }
filesystem-protocol = { path = "../../system/filesystem-protocol" }
smoltcp = { version = "=0.13.1", path = "../../vendor/smoltcp", default-features = false, features = ["proto-dhcpv4"] }

[lints]
workspace = true
