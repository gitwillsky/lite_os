[package]
name = "dhcp-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dhcp-client"
test = false
bench = false

[dependencies]
native-runtime = { path = "../native-runtime" }
launch-protocol = { path = "../launch-protocol" }
network-protocol = { path = "../network-protocol" }
netcfg-protocol = { path = "../netcfg-protocol" }
service-directory = { path = "../service-directory" }
service-rpc = { path = "../service-rpc" }
smoltcp = { version = "=0.13.1", path = "../../vendor/smoltcp", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-raw"] }

[build-dependencies]
launch-protocol = { path = "../launch-protocol" }

[lints]
workspace = true
