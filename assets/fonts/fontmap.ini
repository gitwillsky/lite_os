; LiteOS 字体映射，对应 Windows 2000 注册表的
; HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\FontSubstitutes 与 ...\FontLink\SystemLink。
; FontSubstitutes：请求的字体名未安装时改用右侧字体名（可多级）。
; SystemLink：字体缺字时依次在右侧字体中查找；也是原版字体缺失时的可分发替代链。

[FontSubstitutes]
MS Shell Dlg=Tahoma
MS Shell Dlg 2=Tahoma
SimSun=宋体
NSimSun=新宋体

[SystemLink]
宋体=WenQuanYi Bitmap Song,AR PL UMing CN
新宋体=WenQuanYi Bitmap Song,AR PL UMing CN
Tahoma=宋体,WenQuanYi Bitmap Song,AR PL UMing CN
