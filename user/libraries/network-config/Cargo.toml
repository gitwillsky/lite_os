[package]
name = "network-config"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
glob = "=0.3.3"
calendar = { path = "../calendar" }
linux-uapi = { path = "../linux-uapi" }
router-protocol = { path = "../../../system/router-protocol" }
packet-wire = { path = "../../../libraries/packet-wire" }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"

[lints]
workspace = true
