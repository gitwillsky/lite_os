<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/share/liteos/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <alias><family>MS Shell Dlg</family><prefer><family>Tahoma</family></prefer></alias>
  <alias><family>MS Shell Dlg 2</family><prefer><family>Tahoma</family></prefer></alias>
  <alias>
    <family>Tahoma</family>
    <accept><family>SimSun</family><family>Noto Sans Symbols 2</family></accept>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Tahoma</family><family>SimSun</family><family>Noto Sans Symbols 2</family></prefer>
  </alias>
  <alias><family>serif</family><prefer><family>SimSun</family></prefer></alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono NL</family><family>Noto Sans Symbols 2</family><family>SimSun</family></prefer>
  </alias>

  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <include ignore_missing="yes" prefix="xdg">fontconfig/conf.d</include>
  <include ignore_missing="yes" prefix="xdg">fontconfig/fonts.conf</include>
</fontconfig>
