[workspace]
members = [
    "libraries/classic-ui-abi",
    "libraries/classic-ui-runtime",
    "libraries/liteos-ui",
    "libraries/calendar",
    "libraries/canvas",
    "libraries/classic-theme",
    "programs/compositor",
    "programs/logon",
    "programs/control-panel",
    "programs/desktop",
    "libraries/desktop-entry",
    "libraries/desktop-settings",
    "libraries/network-config",
    "libraries/network-drive",
    "programs/smbfs",
    "programs/file-explorer",
    "libraries/classic-ui",
    "libraries/keyboard",
    "libraries/liteos-runtime",
    "libraries/sndvol",
    "programs/volume-control",
    "programs/terminal",
    "programs/sound-player",
    "programs/media-player",
    "programs/notepad",
    "programs/device-manager",
    "libraries/sound",
    "programs/task-manager",
    "libraries/linux-uapi",
    "libraries/mpv-client",
    "libraries/terminal-font",
    "libraries/terminal-model",
    "libraries/typeface",
    "libraries/wayland-scanner",
    "libraries/wayland-wire",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
linux-uapi = { path = "libraries/linux-uapi" }
keyboard = { path = "libraries/keyboard" }
terminal-font = { path = "libraries/terminal-font" }
terminal-model = { path = "libraries/terminal-model" }
unicode-width = "=0.2.2"

[profile.dev]
panic = "abort"

# 宿主测试只需要可定位源码的回溯；完整变量调试仍由 dev profile 提供。
[profile.test]
debug = "line-tables-only"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
items_after_test_module = "deny"
as_ptr_cast_mut = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
fallible_impl_from = "deny"
lossy_float_literal = "deny"
or_fun_call = "deny"
rc_mutex = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"

[patch.crates-io]
fuser = { path = "../vendor/fuser" }
smb = { path = "../vendor/smb" }
smb-fscc = { path = "../vendor/smb-fscc" }
smb-dtyp = { path = "../vendor/smb-dtyp" }
