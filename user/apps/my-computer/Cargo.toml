[package]
name = "my-computer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autolib = false

# "My Computer": the generic runtime library with no extensions — it uses only
# the library's built-in `fs.*` bridge.
[[bin]]
name = "my-computer"
path = "src/main.rs"

[dependencies]
lite-runtime = { path = "../../lite-runtime" }
